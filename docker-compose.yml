services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: volterra
      POSTGRES_PASSWORD: volterra
      POSTGRES_DB: volterra
    ports: ["5432:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql://volterra:volterra@postgres:5432/volterra
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
